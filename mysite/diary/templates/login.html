<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в Систему</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: linear-gradient(135deg, #1e1e1e 0%, #141414 100%); border: 1px solid #5a4a35; border-radius: 8px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); width: 300px; }
        h2 { margin-top: 0; color: #ffeb3b; text-align: center; text-transform: uppercase; font-size: 18px; letter-spacing: 1px; border-bottom: 1px solid #4a3f2f; padding-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .form-group label { font-size: 12px; color: #aaa49a; text-transform: uppercase; font-weight: bold; }
        .rpg-input { background-color: #1a1a1a; border: 1px solid #5a4a35; border-radius: 4px; color: #fff; padding: 10px; font-size: 14px; outline: none; }
        .rpg-input:focus { border-color: #ffeb3b; }
        .rpg-btn { background: linear-gradient(180deg, #ff9800 0%, #e65100 100%); color: white; border: 1px solid #b33600; border-radius: 4px; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; }
        .error-msg { color: #ff4d4d; font-size: 13px; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Авторизация Стража</h2>
        {% if error %}
            <div class="error-msg">❌ {{ error }}</div>
        {% endif %}
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" name="username" class="rpg-input" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" class="rpg-input" required>
            </div>
            <button type="submit" class="rpg-btn">Войти в архивы</button>
        </form>
    </div>
</body>
</html>
